<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Converter (Stable)</title>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; padding: 20px; background: #f0f2f5; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
        #status { margin: 20px 0; padding: 10px; border-radius: 8px; background: #eee; font-weight: bold; }
        button { background: #0070f3; color: white; border: none; padding: 12px 24px; border-radius: 7px; font-size: 16px; width: 100%; cursor: pointer; }
        button:disabled { background: #ccc; }
        input[type="file"] { margin-bottom: 20px; width: 100%; }
        audio { width: 100%; margin-top: 20px; }
        .download-btn { display: none; margin-top: 15px; color: #0070f3; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>WAV to MP3</h2>
    <p style="font-size: 0.9em; color: #666;">Browser-based conversion (No upload)</p>

    <div id="status">Loading Engine...</div>

    <input type="file" id="uploader" accept="audio/wav">
    <button id="convertBtn" disabled>Convert to MP3</button>
    
    <audio id="player" controls style="display:none;"></audio>
    <a id="downloadLink" class="download-btn">Download MP3</a>
</div>

<script type="module">
    // We use the 'ffmpeg' and 'util' packages from unpkg
    import { FFmpeg } from 'https://unpkg.com/@ffmpeg/ffmpeg@0.12.7/dist/esm/index.js';
    import { fetchFile, toBlobURL } from 'https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js';

    const status = document.getElementById('status');
    const convertBtn = document.getElementById('convertBtn');
    const uploader = document.getElementById('uploader');
    const player = document.getElementById('player');
    const downloadLink = document.getElementById('downloadLink');

    const ffmpeg = new FFmpeg();

    async function load() {
        try {
            // We point to the 'ffmpeg-core' version that doesn't use SharedArrayBuffer
            const baseURL = 'https://unpkg.com/@ffmpeg/core-mt@0.12.6/dist/esm'; 
            // Note: If 'core-mt' fails, we fallback to standard 'core'
            const coreURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm/ffmpeg-core.js';
            const wasmURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm/ffmpeg-core.wasm';

            await ffmpeg.load({
                coreURL: await toBlobURL(coreURL, 'text/javascript'),
                wasmURL: await toBlobURL(wasmURL, 'application/wasm'),
            });

            status.innerText = "Ready to Convert";
            status.style.color = "green";
            convertBtn.disabled = false;
        } catch (e) {
            status.innerText = "Error: " + e.message;
            status.style.color = "red";
        }
    }

    convertBtn.addEventListener('click', async () => {
        if (!uploader.files[0]) return;
        
        const file = uploader.files[0];
        convertBtn.disabled = true;
        status.innerText = "Converting... (Slow version)";

        // 1. Write file to memory
        await ffmpeg.writeFile('input.wav', await fetchFile(file));

        // 2. Run conversion (Single-threaded)
        // -b:a 128k sets the bitrate for smaller size
        await ffmpeg.exec(['-i', 'input.wav', '-b:a', '128k', 'output.mp3']);

        // 3. Read the result
        const data = await ffmpeg.readFile('output.mp3');
        const url = URL.createObjectURL(new Blob([data.buffer], { type: 'audio/mp3' }));

        // 4. Show results
        player.src = url;
        player.style.display = 'block';
        downloadLink.href = url;
        downloadLink.download = file.name.replace('.wav', '.mp3');
        downloadLink.style.display = 'block';
        downloadLink.innerText = "Save MP3 File";
        
        status.innerText = "Finished!";
        convertBtn.disabled = false;
    });

    load();
</script>

</body>
</html>
