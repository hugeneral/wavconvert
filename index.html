<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAV to MP3 Converter</title>
    <!-- Cross-origin isolation for GitHub Pages -->
    <script src="https://cdn.jsdelivr.net/gh/gzuidhof/coi-serviceworker@latest/coi-serviceworker.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 50px; }
        #log { margin-top: 20px; color: #555; font-size: 0.9em; }
        .controls { margin: 20px 0; }
    </style>
</head>
<body>
    <h1>WAV to MP3 Converter</h1>
    <p>Files are processed locally in your browser and never uploaded.</p>

    <div class="controls">
        <input type="file" id="uploader" accept="audio/wav">
        <button id="convertBtn" disabled>Convert to MP3</button>
    </div>

    <div id="log">Loading FFmpeg...</div>
    <audio id="player" controls style="display:none;"></audio>
    <br>
    <a id="downloadLink" style="display:none;">Download MP3</a>

    <script type="module">
        import { FFmpeg } from 'https://unpkg.com/@ffmpeg/ffmpeg@0.12.7/dist/esm/index.js';
        import { fetchFile, toBlobURL } from 'https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js';

        const ffmpeg = new FFmpeg();
        const convertBtn = document.getElementById('convertBtn');
        const uploader = document.getElementById('uploader');
        const log = document.getElementById('log');
        const player = document.getElementById('player');
        const downloadLink = document.getElementById('downloadLink');

        async function load() {
            const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm';
            await ffmpeg.load({
                coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
                wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
            });
            log.innerText = 'FFmpeg Ready. Upload a WAV file.';
            convertBtn.disabled = false;
        }

        convertBtn.addEventListener('click', async () => {
            const { files } = uploader;
            if (files.length === 0) return;

            const file = files[0];
            log.innerText = 'Converting... (This may take a moment)';
            convertBtn.disabled = true;

            // Write the file to FFmpeg's virtual file system
            await ffmpeg.writeFile('input.wav', await fetchFile(file));

            // Execute the conversion command
            // -i: input, -b:a: bitrate (128k for small size)
            await ffmpeg.exec(['-i', 'input.wav', '-b:a', '128k', 'output.mp3']);

            // Read the result
            const data = await ffmpeg.readFile('output.mp3');
            const url = URL.createObjectURL(new Blob([data.buffer], { type: 'audio/mp3' }));

            // Update UI
            player.src = url;
            player.style.display = 'block';
            downloadLink.href = url;
            downloadLink.download = file.name.replace('.wav', '.mp3');
            downloadLink.innerText = 'Download ' + downloadLink.download;
            downloadLink.style.display = 'block';
            
            log.innerText = 'Conversion Complete!';
            convertBtn.disabled = false;
        });

        load();
    </script>
</body>
</html>
