<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Converter (Stable)</title>
    <!-- Lightweight MP3 Encoder -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.all.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; padding: 20px; background: #121212; color: white; }
        .box { border: 1px solid #333; padding: 25px; border-radius: 15px; background: #1e1e1e; max-width: 400px; margin: 40px auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #status { margin: 20px 0; font-weight: bold; color: #00d1b2; }
        button { background: #00d1b2; color: #000; border: none; padding: 15px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; }
        button:disabled { background: #444; color: #777; cursor: not-allowed; }
        input { margin-bottom: 20px; width: 100%; color: #ccc; }
        progress { width: 100%; height: 10px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="box">
    <h2>WAV to MP3</h2>
    <p style="color:#888; font-size:0.9em;">Faster, Mobile-Friendly Version</p>

    <div id="status">Select a WAV file to start</div>

    <input type="file" id="uploader" accept="audio/wav">
    <button id="convertBtn">CONVERT TO MP3</button>
    <progress id="progressBar" value="0" max="100"></progress>
    
    <div id="output"></div>
</div>

<script>
    const uploader = document.getElementById('uploader');
    const convertBtn = document.getElementById('convertBtn');
    const status = document.getElementById('status');
    const progressBar = document.getElementById('progressBar');

    convertBtn.onclick = async () => {
        const file = uploader.files[0];
        if (!file) return alert("Select a file first");

        convertBtn.disabled = true;
        status.innerText = "Reading file...";
        progressBar.style.display = "block";

        try {
            // 1. Decode the WAV file using the browser's built-in AudioContext
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const arrayBuffer = await file.arrayBuffer();
            const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

            status.innerText = "Encoding MP3...";
            
            // 2. Setup the LAME encoder
            const channels = audioBuffer.numberOfChannels;
            const sampleRate = audioBuffer.sampleRate;
            const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, 128);
            
            const mp3Data = [];
            const sampleBlockSize = 1152; // standard for MP3

            // Support both Mono and Stereo
            if (channels === 2) {
                const left = audioBuffer.getChannelData(0);
                const right = audioBuffer.getChannelData(1);
                const leftInt = toInt16(left);
                const rightInt = toInt16(right);

                for (let i = 0; i < leftInt.length; i += sampleBlockSize) {
                    const lChunk = leftInt.subarray(i, i + sampleBlockSize);
                    const rChunk = rightInt.subarray(i, i + sampleBlockSize);
                    const mp3buf = mp3encoder.encodeBuffer(lChunk, rChunk);
                    if (mp3buf.length > 0) mp3Data.push(mp3buf);
                    progressBar.value = (i / leftInt.length) * 100;
                }
            } else {
                const samples = audioBuffer.getChannelData(0);
                const samplesInt = toInt16(samples);
                for (let i = 0; i < samplesInt.length; i += sampleBlockSize) {
                    const chunk = samplesInt.subarray(i, i + sampleBlockSize);
                    const mp3buf = mp3encoder.encodeBuffer(chunk);
                    if (mp3buf.length > 0) mp3Data.push(mp3buf);
                    progressBar.value = (i / samplesInt.length) * 100;
                }
            }

            const endBuf = mp3encoder.flush();
            if (endBuf.length > 0) mp3Data.push(endBuf);

            // 3. Create Download
            const blob = new Blob(mp3Data, { type: 'audio/mp3' });
            const url = URL.createObjectURL(blob);

            status.innerText = "FINISHED!";
            document.getElementById('output').innerHTML = `
                <audio src="${url}" controls style="width:100%; margin-top:20px;"></audio>
                <br><br>
                <a href="${url}" download="${file.name.replace('.wav', '.mp3')}" 
                   style="color:#00d1b2; text-decoration:none; border:1px solid #00d1b2; padding:10px; border-radius:5px; display:inline-block;">
                   SAVE MP3 FILE
                </a>
            `;

        } catch (err) {
            console.error(err);
            status.innerText = "Error: " + err.message;
        }
        convertBtn.disabled = false;
        progressBar.style.display = "none";
    };

    // Helper to convert browser float audio to 16-bit integers
    function toInt16(floatSamples) {
        const intSamples = new Int16Array(floatSamples.length);
        for (let i = 0; i < floatSamples.length; i++) {
            let s = Math.max(-1, Math.min(1, floatSamples[i]));
            intSamples[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        return intSamples;
    }
</script>
</body>
</html>
