<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Converter v7</title>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; padding: 20px; background: #121212; color: white; }
        .box { border: 1px solid #333; padding: 25px; border-radius: 15px; background: #1e1e1e; max-width: 400px; margin: 0 auto; }
        #status { margin: 20px 0; font-weight: bold; color: #00d1b2; }
        #log { font-size: 10px; color: #888; text-align: left; height: 100px; overflow-y: auto; background: #000; padding: 10px; border-radius: 5px; margin-top: 20px; font-family: monospace; }
        button { background: #00d1b2; color: #000; border: none; padding: 15px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; }
        button:disabled { background: #444; color: #777; }
        input { margin-bottom: 20px; width: 100%; }
        audio { width: 100%; margin-top: 20px; }
    </style>
</head>
<body>

<div class="box">
    <h2>Converter v7</h2>
    <div id="status">Loading FFmpeg...</div>

    <input type="file" id="uploader" accept="audio/wav">
    <button id="convertBtn" disabled>CONVERT TO MP3</button>
    
    <div id="output"></div>
    <div id="log"></div>
</div>

<!-- We use the UMD version of 0.11.6 for better compatibility -->
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

<script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    const status = document.getElementById('status');
    const convertBtn = document.getElementById('convertBtn');
    const logEl = document.getElementById('log');

    function logger(msg) {
        console.log(msg);
        logEl.innerHTML += msg + "<br>";
        logEl.scrollTop = logEl.scrollHeight;
    }

    // 1. Initialize FFmpeg with specific core path to avoid security issues
    const ffmpeg = createFFmpeg({ 
        log: true,
        // We use the single-thread core to avoid SharedArrayBuffer issues
        corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js'
    });

    async function init() {
        try {
            logger("Starting load...");
            await ffmpeg.load();
            logger("Load complete!");
            status.innerText = "READY";
            convertBtn.disabled = false;
        } catch (e) {
            logger("LOAD ERROR: " + e.message);
            status.innerText = "FAILED TO LOAD";
        }
    }

    convertBtn.onclick = async () => {
        const file = document.getElementById('uploader').files[0];
        if (!file) return;

        convertBtn.disabled = true;
        status.innerText = "WORKING...";
        logger("Reading file...");

        try {
            // Write the file to memory
            ffmpeg.FS('writeFile', 'input.wav', await fetchFile(file));
            logger("File written. Converting...");

            // Run command: -i (input) -b:a (bitrate 128k) output.mp3
            await ffmpeg.run('-i', 'input.wav', '-b:a', '128k', 'output.mp3');
            logger("Conversion done!");

            // Read the result
            const data = ffmpeg.FS('readFile', 'output.mp3');
            const url = URL.createObjectURL(new Blob([data.buffer], { type: 'audio/mp3' }));

            document.getElementById('output').innerHTML = `
                <audio src="${url}" controls></audio>
                <br><br>
                <a href="${url}" download="converted.mp3" style="color:#00d1b2; text-decoration:none; border:1px solid #00d1b2; padding:10px; border-radius:5px;">SAVE MP3</a>
            `;
            status.innerText = "SUCCESS!";
        } catch (err) {
            logger("ERROR: " + err.message);
            status.innerText = "CONVERSION ERROR";
        }
        convertBtn.disabled = false;
    };

    init();
</script>
</body>
</html>
